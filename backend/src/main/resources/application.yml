server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

spring:
  application:
    name: helixflow-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_JDBC_URL:jdbc:h2:mem:helixflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

helixflow:
  ai:
    mock-mode: ${HELIXFLOW_AI_MOCK_MODE:true}
  llm:
    grok:
      base-url: ${GROK_BASE_URL:https://api.x.ai/v1}
      model: ${GROK_MODEL:grok-2}
      api-key: ${GROK_API_KEY:}
      connect-timeout-ms: 2000
      read-timeout-ms: 6000
      max-retries: 1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
